services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superclickup
      POSTGRES_PASSWORD: superclickup
      POSTGRES_DB: superclickup
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superclickup"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://superclickup:superclickup@db:5432/superclickup
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8110:80"
    depends_on:
      - backend

volumes:
  db_data:
